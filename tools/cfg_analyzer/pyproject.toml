[project]
name = "cfg-analyzer"
version = "0.1.0"
description = "CFG analysis and visualization tool for C files using LLVM"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "pydot>=2.0",
    "graphviz>=0.20",
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
cfg-analyze = "cfg_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfg_analyzer"]
