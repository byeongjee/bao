name: Lint & Format

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-lint:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: scripts/ckpt
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check
          src: scripts/ckpt

  cpp-format:
    name: C++ (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jidicula/clang-format-action@v4.14.0
        with:
          clang-format-version: 18
          check-path: passes/src
      - uses: jidicula/clang-format-action@v4.14.0
        with:
          clang-format-version: 18
          check-path: passes/include

  cpp-tidy:
    name: C++ (clang-tidy)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      # Gurobi headers/libs are a free unauthenticated download; a license is
      # only checked when the solver actually runs (GRBEnv creation), and this
      # job only compiles — it never runs the solver.
      - name: Install Gurobi
        run: |
          curl -fsSL https://packages.gurobi.com/13.0/gurobi13.0.0_linux64.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "GUROBI_HOME=$RUNNER_TEMP/gurobi1300/linux64" >> "$GITHUB_ENV"
      - name: Generate compile_commands.json
        run: |
          cmake -S passes -B passes/build \
            -DCMAKE_C_COMPILER="$LLVM_ROOT/build/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_ROOT/build/bin/clang++" \
            -DLLVM_DIR="$LLVM_ROOT/build/lib/cmake/llvm"
      - name: Run clang-tidy
        run: CLANG_TIDY="$LLVM_ROOT/build/bin/clang-tidy" scripts/run_clang_tidy.sh --all
