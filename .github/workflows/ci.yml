name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on PR force-pushes/rebases, but never cancel main
# runs: they populate the shared LLVM cache that all PRs restore from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-lint:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: scripts/ckpt
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check
          src: scripts/ckpt

  python-typecheck:
    name: Python (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv run pyright

  cpp-format:
    name: C++ (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jidicula/clang-format-action@v4.14.0
        with:
          clang-format-version: 18
          check-path: passes/src
      - uses: jidicula/clang-format-action@v4.14.0
        with:
          clang-format-version: 18
          check-path: passes/include

  python-unit:
    name: Python (pytest, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv run --extra test pytest tests/ -m unit

  # Sole owner of the LLVM cache: restores it, or builds + saves it once on
  # a cold key. The heavy jobs below depend on it and are restore-only, so
  # LLVM is never built more than once per cache key.
  llvm-cache:
    name: LLVM cache
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm

  cpp-tidy:
    name: C++ (clang-tidy)
    needs: llvm-cache
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
        with:
          mode: restore
      # Gurobi headers/libs are a free unauthenticated download; a license is
      # only checked when the solver actually runs (GRBEnv creation), and this
      # job only compiles — it never runs the solver.
      - name: Install Gurobi
        run: |
          curl -fsSL https://packages.gurobi.com/13.0/gurobi13.0.0_linux64.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "GUROBI_HOME=$RUNNER_TEMP/gurobi1300/linux64" >> "$GITHUB_ENV"
      - name: Generate compile_commands.json
        run: |
          cmake -S passes -B passes/build \
            -DCMAKE_C_COMPILER="$LLVM_ROOT/build/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_ROOT/build/bin/clang++" \
            -DLLVM_DIR="$LLVM_ROOT/build/lib/cmake/llvm"
      - name: Run clang-tidy
        run: CLANG_TIDY="$LLVM_ROOT/build/bin/clang-tidy" scripts/run_clang_tidy.sh --all

  pass-tests:
    name: Passes (pytest, non-MILP)
    needs: llvm-cache
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MSP430GCC_TOOLCHAIN_PATH: /home/runner/msp430-gcc
      # bb-energy-analyzer resolves msp430-elf-objdump via this (differently
      # named) variable; without it the line table comes back empty and the
      # pipeline fails with "no basic block mappings".
      MSP430_GCC_DIR: /home/runner/msp430-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
        with:
          mode: restore
      # Gurobi headers/libs are a free unauthenticated download; a license is
      # only checked when the solver actually runs (GRBEnv creation). Building
      # CheckpointPass.so just links the libraries, and the MILP tests that
      # would run the solver are excluded below.
      - name: Install Gurobi
        run: |
          curl -fsSL https://packages.gurobi.com/13.0/gurobi13.0.0_linux64.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "GUROBI_HOME=$RUNNER_TEMP/gurobi1300/linux64" >> "$GITHUB_ENV"
      # The RockClimb/SCHEMATIC compile pipelines assemble and link with
      # msp430-elf-gcc, and bb-energy-analyzer disassembles with
      # msp430-elf-objdump. The toolchain and device support files (headers +
      # linker scripts) come from TI's tokenless public mirror; the support
      # files are merged into the toolchain tree to match the layout of TI's
      # full installer, which the compile pipelines expect.
      - name: Restore MSP430-GCC toolchain cache
        id: msp430-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/msp430-gcc
          key: msp430-gcc-9.3.1.11-support-1.212-linux64
      - name: Install MSP430-GCC toolchain
        if: steps.msp430-cache.outputs.cache-hit != 'true'
        run: |
          base=https://software-dl.ti.com/msp430/msp430_public_sw/mcu/msp430/MSPGCC/9_3_1_2/export
          mkdir -p "$MSP430GCC_TOOLCHAIN_PATH"
          curl -fsSL "$base/msp430-gcc-9.3.1.11_linux64.tar.bz2" \
            | tar xj --strip-components=1 -C "$MSP430GCC_TOOLCHAIN_PATH"
          curl -fsSL -o "$RUNNER_TEMP/msp430-support.zip" \
            "$base/msp430-gcc-support-files-1.212.zip"
          unzip -q "$RUNNER_TEMP/msp430-support.zip" -d "$RUNNER_TEMP"
          mkdir -p "$MSP430GCC_TOOLCHAIN_PATH/include"
          cp -R "$RUNNER_TEMP"/msp430-gcc-support-files/include/. "$MSP430GCC_TOOLCHAIN_PATH/include/"
      - name: Build checkpoint passes
        run: |
          cmake -S passes -B passes/build \
            -DCMAKE_C_COMPILER="$LLVM_ROOT/build/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_ROOT/build/bin/clang++" \
            -DLLVM_DIR="$LLVM_ROOT/build/lib/cmake/llvm" \
            -DSCHEMATIC_BUILD_TESTS=ON
          cmake --build passes/build -j "$(nproc)" \
            --target CheckpointPass RockClimbMachinePass BBDebugInfoPass bb-energy-analyzer \
              schematic_unit_tests bb_energy_analyzer_unit_tests
      - name: Run C++ unit tests
        run: ctest --test-dir passes/build --output-on-failure
      - uses: astral-sh/setup-uv@v9.0.0
      # MILP tests are excluded because they run the Gurobi solver, which
      # needs a license. Unit tests already run in the python-unit job.
      - name: Run pass tests
        run: |
          LLVM_DIR="$LLVM_ROOT/build" uv run --extra test pytest tests/ -m "not milp and not unit"
