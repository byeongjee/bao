name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-lint:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: scripts/ckpt
      # TODO: enable after running `ruff format scripts/ckpt`
      # - uses: astral-sh/ruff-action@v3
      #   with:
      #     args: format --check
      #     src: scripts/ckpt

  cpp-format:
    name: C++ (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jidicula/clang-format-action@v4.14.0
        with:
          clang-format-version: 18
          check-path: passes/src
      - uses: jidicula/clang-format-action@v4.14.0
        with:
          clang-format-version: 18
          check-path: passes/include
