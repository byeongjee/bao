[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "checkpoint-insertion"
version = "0.1.0"
description = "MILP-based checkpoint insertion tool for intermittent computing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pyserial>=3.5", "click>=8.1"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-xdist>=3.0"]
plot = ["matplotlib>=3.5", "numpy>=1.20"]

[project.scripts]
ckpt = "ckpt.cli:main"

[tool.setuptools.package-dir]
"" = "scripts"

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.pyright]
reportUnusedImport = "warning"
reportUnusedVariable = "warning"

[tool.pytest.ini_options]
addopts = "-v -n auto"
markers = [
    "milp: MILP checkpoint pass tests",
    "rockclimb: RockClimb machine-level (post-regalloc) pass tests",
    "schematic: SCHEMATIC pass tests",
    "vm_nvm: VM/NVM placement tests",
    "unit: Pure-function unit tests (no subprocess, no device)",
]
