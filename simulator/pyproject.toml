[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intermittent-sim"
version = "0.1.0"
description = "Hardware-in-the-loop simulator for intermittent computing using Otii Ace Pro"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "otii-tcp-client>=1.0.0",
]

[project.scripts]
intermittent-sim = "intermittent_sim.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["intermittent_sim"]
